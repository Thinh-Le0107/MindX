<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TECH/STORE - Thiết Bị Công Nghệ Cho Học Tập</title>
    <link rel="stylesheet" href="stylebt2.css">
</head>
<body>
    <div class="wrapper">
        <div class="top-box">
            <h1 class="logo">TECH/STORE</h1>
            <nav class="menu">
                <p><a href="#products">Sản phẩm</a></p>
                <p><a>•</a></p>
                <p><a href="#offers">Ưu đãi</a></p>
                <p><a>•</a></p>
                <p><a href="#support">Hỗ trợ</a></p>
            </nav>
            <div class="button">
                <button class="cart">Giỏ hàng
                    <div class="circle">0</div>
                </button>
            </div>
        </div>

        <div class="mid-box">
            <p class="NEW-COLLECTION">NEW COLLECTION</p>
            <h1 class="slogan">Gear tốt hơn.<br>Học tập tập trung hơn.</h1>
            <p class="intro">Thiết bị được chọn cho góc làm việc của sinh viên công nghệ.</p>
            <button class="explore-button">Khám phá sản phẩm</button>
        </div>

        <h1 class="title">Sản phẩm nổi bật</h1>

        <div class="products-box" id="products">
            <div class="keyboard-box">
                <div class="products-image">
                    <img src="keyboard.jpg" alt="Bàn phím cơ Nova Keyboard">
                </div>
                <h2 class="name">Nova Keyboard</h2>
                <h3 class="price">1.290.000đ</h3>
                <div class="discount">-10%</div>
            </div>

            <div class="headphone-box">
                <div class="products-image">
                    <img src="headphone.jpg" alt="Tai nghe Pulse Headphones">
                </div>
                <h2 class="name">Pulse Headphones</h2>
                <h3 class="price">890.000đ</h3>
                <div class="discount">-15%</div>
            </div>

            <div class="desklight-box">
                <div class="products-image">
                    <img src="desklight.jpg" alt="Đèn bàn Orbit Desk Light">
                </div>
                <h2 class="name">Orbit Desk Light</h2>
                <h3 class="price">490.000đ</h3>
                <div class="discount">-20%</div>
            </div>
        </div>
    </div>
</body>
</html>
