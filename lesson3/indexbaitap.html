<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stylebaitap.css">
</head>
<body>
    <div class="menu">
        <h1 class="logo">TECH/STORE</h1>
        <h2 class="tagline">Sản Phẩm . Ưu Đãi . Hỗ Trợ</h2>
        <button class="cart-button">Giỏ hàng</button>
        <p class="circle">0</p>
    </div>
    <div class="main">
        <p class="collection-title">NEW COLLECTION</p>
        <h1 class="collection-heading">Gear tốt hơn.<br>Học tập tập trung hơn.</h1>
        <p>Thiết bị được chọn cho góc làm việc của sinh viên công nghệ.</p>
        <button class="explore-button">Khám phá sản phẩm</button>
    </div>
    <h1 class="products-heading">Sản phẩm nổi bật</h1>
    <div class="Nova-Keyboard">
        <div class="image-product">
            <img src="keyboard.jpg" alt="Product 1">
        </div>
        <h2 class="keyboard">Nova Keyboard</h2>
        <p class="keyboard-price">2.500.000đ</p>
        <div class="keyboard-discount">-10%</div>
    </div>
    <div class="Nova-Headphones">
        <div class="image-product">
            <img src="headphone.jpg" alt="Product 3">
        </div>
        <h2 class="Headphones">Nova Headphones</h2>
        <p class="Headphones-price">1.200.000đ</p>
        <div class="Headphones-discount">-15%</div>
    </div>
</body>
</html>
